<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mein Stoisches Tagebuch</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body, input, textarea, button, h1, h2, h3, h4, p, span, div { 
            font-family: 'Times New Roman', Times, serif !important; 
        }
        
        body { margin: 0; padding: 0; background-color: #e5e7eb; }
        .pb-safe { padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-down { animation: fadeInDown 0.3s ease-out forwards; }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Animation für Zitat-Wechsel */
        @keyframes quoteSwap {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-quote-swap { animation: quoteSwap 0.5s ease-out; }
        
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- SVG Icons ---
        const IconSun = ({ size = 24, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>;
        const IconMoon = ({ size = 24, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>;
        const IconBook = ({ size = 24, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>;
        const IconSave = ({ size = 20, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
        const IconCheckCircle = ({ size = 20, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
        const IconShield = ({ size = 20, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
        const IconScale = ({ size = 20, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>;
        const IconAnchor = ({ size = 20, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="5" r="3"/><line x1="12" y1="22" x2="12" y2="8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></svg>;
        const IconLightbulb = ({ size = 20, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>;
        const IconFeather = ({ size = 24, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>;
        const IconQuote = ({ size = 24, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1.5.5 1.5 1.5L5 15c0 1.5.5 4-2 6Z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.5c1 0 1.5.5 1.5 1.5L17 15c0 1.5.5 4-2 6Z"/></svg>;
        const IconPlus = ({ size = 20, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const IconRefresh = ({ size = 20, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
        const IconList = ({ size = 20, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>;
        const IconClose = ({ size = 20, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        const IconFlame = ({ size = 20, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>;
        const IconZap = ({ size = 20, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>;
        const IconEyeOff = ({ size = 20, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>;
        const IconCloudRain = ({ size = 20, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg>;
        const IconSettings = ({ size = 20, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
        const IconDownload = ({ size = 20, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
        const IconUpload = ({ size = 20, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
        const IconEdit = ({ size = 20, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
        const IconTrash = ({ size = 20, className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;

        const defaultQuotes = [
            { text: "Vergeude keine Zeit mehr damit, darüber zu streiten, was ein guter Mann sein sollte. Sei einer.", author: "Marcus Aurelius" },
            { text: "Wir leiden öfter in der Vorstellung als in der Realität.", author: "Seneca" },
            { text: "Es sind nicht die Dinge selbst, die uns beunruhigen, sondern die Vorstellungen und Meinungen, die wir von den Dingen haben.", author: "Epiktet" },
            { text: "Das Glück deines Lebens hängt von der Beschaffenheit deiner Gedanken ab.", author: "Marcus Aurelius" },
            { text: "Wenn du am Morgen erwachst, denke daran, was für ein kostbares Privileg es ist, am Leben zu sein.", author: "Marcus Aurelius" }
        ];

        const SectionHeader = ({ title, description, t }) => (
            <div className="mb-4 transition-colors duration-500">
                <h3 className={`text-lg font-bold ${t.textPrimary}`}>{title}</h3>
                {description && <p className={`text-sm italic mt-1 ${t.textMuted}`}>{description}</p>}
            </div>
        );

        const TextArea = ({ label, value, onChange, placeholder, rows = "h-28", t }) => (
            <div className="mb-4">
                {label && <label className={`block text-sm font-bold mb-1 transition-colors duration-500 ${t.textPrimary}`}>{label}</label>}
                <textarea
                    className={`w-full p-3 rounded-lg border outline-none transition-all duration-300 resize-none ${rows} text-sm ${t.inputBg} ${t.inputBorder} ${t.inputText}`}
                    value={value}
                    onChange={(e) => onChange(e.target.value)}
                    placeholder={placeholder}
                />
            </div>
        );

        function App() {
            const [activeTab, setActiveTab] = useState('morning');
            const [showToast, setShowToast] = useState(false);
            const [toastMsg, setToastMsg] = useState('');
            const [isQuoteRefreshing, setIsQuoteRefreshing] = useState(false);
            const [editingQuoteIndex, setEditingQuoteIndex] = useState(null);
            
            const [entry, setEntry] = useState(getEmptyEntry());
            
            const [history, setHistory] = useState(() => {
                try {
                    const savedHistory = localStorage.getItem('stoisches_tagebuch_historie');
                    return savedHistory ? JSON.parse(savedHistory) : [];
                } catch (e) { return []; }
            });

            const [draft, setDraft] = useState(() => {
                try {
                    const savedDraft = localStorage.getItem('stoisches_tagebuch_draft');
                    if (savedDraft) {
                        const parsedDraft = JSON.parse(savedDraft);
                        if (parsedDraft.date === new Date().toISOString().split('T')[0]) return parsedDraft;
                    }
                } catch (e) {}
                return null;
            });

            useEffect(() => {
                if (draft && !entry.id) setEntry(prev => ({ ...prev, ...draft }));
            }, []);

            useEffect(() => {
                localStorage.setItem('stoisches_tagebuch_historie', JSON.stringify(history));
            }, [history]);

            useEffect(() => {
                if (draft) localStorage.setItem('stoisches_tagebuch_draft', JSON.stringify(draft));
                else localStorage.removeItem('stoisches_tagebuch_draft');
            }, [draft]);

            const [quotes, setQuotes] = useState(() => {
                try {
                    const savedQuotes = localStorage.getItem('stoisches_tagebuch_zitate');
                    return savedQuotes ? JSON.parse(savedQuotes) : defaultQuotes;
                } catch (e) { return defaultQuotes; }
            });

            useEffect(() => {
                localStorage.setItem('stoisches_tagebuch_zitate', JSON.stringify(quotes));
            }, [quotes]);

            const [dailyQuote, setDailyQuote] = useState(null);
            const [showQuoteForm, setShowQuoteForm] = useState(false);
            const [showQuotesListModal, setShowQuotesListModal] = useState(false); 
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [confirmModal, setConfirmModal] = useState({ isOpen: false });
            const [newQuoteText, setNewQuoteText] = useState('');
            const [newQuoteAuthor, setNewQuoteAuthor] = useState('');

            const pickRandomQuote = () => {
                setIsQuoteRefreshing(true);
                setTimeout(() => {
                    if(quotes.length > 0) {
                        const randomIndex = Math.floor(Math.random() * quotes.length);
                        setDailyQuote(quotes[randomIndex]);
                    }
                    setIsQuoteRefreshing(false);
                }, 300);
            };

            useEffect(() => {
                pickRandomQuote();
            }, []);

            const handleAddQuote = () => {
                if(newQuoteText.trim() !== '') {
                    const author = newQuoteAuthor.trim() !== '' ? newQuoteAuthor.trim() : 'Unbekannt';
                    const newQuote = { text: newQuoteText.trim(), author: author };
                    
                    if (editingQuoteIndex !== null) {
                        const updatedQuotes = [...quotes];
                        updatedQuotes[editingQuoteIndex] = newQuote;
                        setQuotes(updatedQuotes);
                        setEditingQuoteIndex(null);
                    } else {
                        setQuotes([newQuote, ...quotes]);
                    }
                    
                    setDailyQuote(newQuote);
                    setNewQuoteText('');
                    setNewQuoteAuthor('');
                    setShowQuoteForm(false);
                }
            };

            const handleDeleteQuote = (index) => {
                setConfirmModal({
                    isOpen: true,
                    title: 'Zitat löschen',
                    message: 'Möchtest du dieses Zitat wirklich löschen?',
                    confirmText: 'Löschen',
                    cancelText: 'Abbrechen',
                    isDanger: true,
                    onConfirm: () => {
                        const updatedQuotes = quotes.filter((_, i) => i !== index);
                        setQuotes(updatedQuotes);
                        setConfirmModal({ isOpen: false });
                        showNotification("Zitat gelöscht.");
                    }
                });
            };

            const handleEditQuoteRequest = (index) => {
                const q = quotes[index];
                setNewQuoteText(q.text);
                setNewQuoteAuthor(q.author);
                setEditingQuoteIndex(index);
                setShowQuoteForm(true);
                setShowQuotesListModal(false);
            };

            function getEmptyEntry() {
                return {
                    id: '',
                    date: new Date().toISOString().split('T')[0],
                    mood: '', controlIn: '', controlOut: '', obstacle: '', reaction: '',
                    virtue: '', virtueReason: '', vices: [], vicesReason: '', intention: '', wrong: '', right: '', better: '',
                    gratitude: '', mementoMori: ''
                };
            }

            const handleInputChange = (field, value) => {
                setEntry(prev => ({ ...prev, [field]: value }));
            };

            const handleViceToggle = (viceId) => {
                setEntry(prev => {
                    const currentVices = prev.vices || [];
                    if (currentVices.includes(viceId)) {
                        return { ...prev, vices: currentVices.filter(id => id !== viceId) };
                    } else {
                        return { ...prev, vices: [...currentVices, viceId] };
                    }
                });
            };

            const showNotification = (msg) => {
                setToastMsg(msg);
                setShowToast(true);
                setTimeout(() => setShowToast(false), 3000);
            };

            const initiateSave = (type) => {
                const isMorningOnly = type === 'morning_draft';
                const missingFields = [];
                const morningFields = ["mood", "controlIn", "controlOut", "obstacle", "reaction", "virtue", "virtueReason", "intention"];
                const eveningFields = ["wrong", "right", "better", "gratitude", "mementoMori"];
                
                const fieldsToCheck = isMorningOnly ? morningFields : [...morningFields, ...eveningFields];

                fieldsToCheck.forEach(f => {
                    if (!entry[f] || String(entry[f]).trim() === '') missingFields.push(f);
                });

                if (missingFields.length > 0) {
                    setConfirmModal({
                        isOpen: true,
                        title: 'Unvollständig',
                        message: `Einige Felder sind noch leer. Trotzdem speichern?\n(${missingFields.length} Felder fehlen)`,
                        confirmText: 'Trotzdem speichern',
                        cancelText: 'Weiter bearbeiten',
                        onConfirm: () => isMorningOnly ? performDraftSave() : performFinalSave()
                    });
                } else {
                    isMorningOnly ? performDraftSave() : performFinalSave();
                }
            };

            const performDraftSave = () => {
                setDraft(entry);
                showNotification("Morgen-Reflexion gespeichert.");
                setConfirmModal({ isOpen: false });
            };

            const performFinalSave = () => {
                if (entry.id) {
                    setHistory(prev => prev.map(h => h.id === entry.id ? entry : h));
                } else {
                    setHistory(prev => [{ ...entry, id: Date.now().toString() }, ...prev]);
                    setDraft(null);
                }
                setEntry(getEmptyEntry());
                setActiveTab('history');
                setConfirmModal({ isOpen: false });
                showNotification("Tag abgeschlossen.");
            };

            const handleEdit = (histEntry) => {
                setEntry({ ...histEntry });
                setActiveTab('morning');
            };

            const handleDelete = (id) => {
                setConfirmModal({
                    isOpen: true,
                    title: 'Eintrag löschen',
                    message: 'Wirklich unwiderruflich löschen?',
                    confirmText: 'Löschen',
                    cancelText: 'Abbrechen',
                    isDanger: true,
                    onConfirm: () => {
                        setHistory(prev => prev.filter(h => h.id !== id));
                        setConfirmModal({ isOpen: false });
                        showNotification("Gelöscht.");
                    }
                });
            };

            const handleExportData = () => {
                const data = JSON.stringify({ history, quotes });
                const blob = new Blob([data], { type: "application/json" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = `stoisches_backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
            };

            const handleImportData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const data = JSON.parse(event.target.result);
                    if (data.history) setHistory(data.history);
                    if (data.quotes) setQuotes(data.quotes);
                    showNotification("Importiert!");
                };
                reader.readAsText(file);
            };

            const virtues = [
                { id: 'Weisheit', icon: <IconLightbulb size={20} />, desc: 'Objektivität' },
                { id: 'Mut', icon: <IconShield size={20} />, desc: 'Das Richtige tun' },
                { id: 'Gerechtigkeit', icon: <IconScale size={20} />, desc: 'Fairness' },
                { id: 'Mäßigung', icon: <IconAnchor size={20} />, desc: 'Maß halten' }
            ];

            const vicesList = [
                { id: 'Impulsivität', icon: <IconFlame size={20} />, desc: 'Reaktionen' },
                { id: 'Unruhe', icon: <IconZap size={20} />, desc: 'Gedankliche Hast' },
                { id: 'Ablenkung', icon: <IconEyeOff size={20} />, desc: 'Fokusverlust' },
                { id: 'Negativität', icon: <IconCloudRain size={20} />, desc: 'Pessimismus' }
            ];

            const themes = {
                morning: {
                    wrapper: "bg-stone-200", container: "bg-stone-100", header: "bg-stone-800 text-stone-50 border-stone-800",
                    headerSubtitle: "text-stone-300", card: "bg-white border-stone-200 shadow-sm",
                    textPrimary: "text-stone-800", textSecondary: "text-stone-600", textMuted: "text-stone-500",
                    inputBg: "bg-stone-50", inputBorder: "border-stone-200 focus:ring-stone-400 focus:border-stone-400",
                    inputText: "text-stone-800 placeholder-stone-400", buttonPrimary: "bg-stone-800 text-stone-50 hover:bg-stone-700 shadow-stone-800/20",
                    navBg: "bg-white border-stone-200", navActive: "text-stone-800", navInactive: "text-stone-400",
                    virtueBtnActive: "bg-stone-800 text-stone-50 border-stone-800 shadow-md", virtueBtnInactive: "bg-stone-50 text-stone-600 border-stone-200 hover:bg-stone-100",
                    viceBtnActive: "bg-red-900 text-stone-50 border-red-900 shadow-md",
                    quoteBg: "bg-stone-100", quoteBorder: "border-stone-300", quoteIcon: "text-stone-300",
                    badgeVice: "bg-red-100 text-red-800"
                },
                evening: {
                    wrapper: "bg-slate-950", container: "bg-slate-900", header: "bg-slate-950 text-slate-50 border-b border-slate-800",
                    headerSubtitle: "text-slate-400", card: "bg-slate-800 border-slate-700 shadow-md",
                    textPrimary: "text-slate-100", textSecondary: "text-slate-300", textMuted: "text-slate-400",
                    inputBg: "bg-slate-900", inputBorder: "border-slate-600 focus:ring-indigo-500 focus:border-indigo-500",
                    inputText: "text-slate-100 placeholder-slate-500", buttonPrimary: "bg-indigo-600 text-white hover:bg-indigo-500 shadow-indigo-900/30",
                    navBg: "bg-slate-900 border-slate-800", navActive: "text-indigo-400", navInactive: "text-slate-600",
                    virtueBtnActive: "bg-indigo-600 text-white border-indigo-600 shadow-md", virtueBtnInactive: "bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-800",
                    viceBtnActive: "bg-rose-900 text-white border-rose-900 shadow-md",
                    quoteBg: "bg-slate-800", quoteBorder: "border-slate-700", quoteIcon: "text-slate-600",
                    badgeVice: "bg-rose-900/40 text-rose-300"
                },
                history: {
                    wrapper: "bg-[#140b1c]", container: "bg-[#1b112c]", header: "bg-[#140b1c] text-[#d4af37] border-b border-[#3b1f52]", 
                    headerSubtitle: "text-[#a68bb8]", card: "bg-[#2a1b40] border-[#432a63] shadow-lg shadow-purple-900/20",
                    textPrimary: "text-[#d4af37]", textSecondary: "text-[#e2d9f3]", textMuted: "text-[#8869a1]",
                    inputBg: "bg-[#1b112c]", inputBorder: "border-[#432a63] focus:ring-[#d4af37] focus:border-[#d4af37]",
                    inputText: "text-[#e2d9f3] placeholder-[#64497d]", buttonPrimary: "bg-[#d4af37] text-[#140b1c] hover:bg-[#b5952f] shadow-[#d4af37]/20",
                    navBg: "bg-[#140b1c] border-[#3b1f52]", navActive: "text-[#d4af37]", navInactive: "text-[#543b6b]",
                    virtueBtnActive: "bg-[#d4af37] text-[#140b1c] border-[#d4af37] shadow-md", virtueBtnInactive: "bg-[#1b112c] text-[#e2d9f3] border-[#432a63] hover:bg-[#2a1b40]",
                    viceBtnActive: "bg-[#7a1f3d] text-[#e2d9f3] border-[#7a1f3d] shadow-md",
                    quoteBg: "bg-[#2a1b40]", quoteBorder: "border-[#432a63]", quoteIcon: "text-[#432a63]",
                    badgeVice: "bg-[#7a1f3d]/40 text-[#f5a6c4]"
                }
            };

            const t = themes[activeTab];

            const t_label = (activeTab === 'morning' || entry.id) ? formatDate(entry.date) : formatDate(new Date().toISOString().split('T')[0]);

            return (
                <div className={`min-h-screen flex justify-center transition-colors duration-500 ${t.wrapper}`}>
                    <div className={`w-full max-w-md min-h-screen shadow-2xl relative flex flex-col transition-colors duration-500 overflow-hidden ${t.container}`}>
                        <header className={`p-6 pt-8 rounded-b-2xl z-10 shrink-0 transition-colors duration-500 ${t.header}`}>
                            <div className="flex justify-between items-center mb-2">
                                <h1 className="text-2xl font-bold flex items-center gap-2"><IconFeather size={24} /> Mein Tagebuch</h1>
                                <button onClick={() => setShowSettingsModal(true)} className="p-2 rounded-full hover:bg-white/10"><IconSettings size={22} /></button>
                            </div>
                            <p className={`text-sm ${t.headerSubtitle}`}>{t_label}</p>
                        </header>

                        <main className="flex-1 overflow-y-auto pb-24 p-5 relative">
                            {showToast && (
                                <div className="bg-emerald-100 border border-emerald-400 text-emerald-800 px-4 py-3 rounded-lg mb-4 flex items-center gap-2 shadow-sm animate-fade-in-down">
                                    <IconCheckCircle size={20} /><span>{toastMsg}</span>
                                </div>
                            )}

                            {activeTab === 'morning' && (
                                <div className="space-y-6 animate-fade-in">
                                    <div className={`p-5 rounded-xl border relative transition-colors duration-500 ${t.card} ${t.quoteBg}`}>
                                        <IconQuote size={36} className={`absolute top-4 left-4 opacity-50 ${t.quoteIcon}`} />
                                        <div className={`relative z-10 pl-8 pr-2 ${isQuoteRefreshing ? 'animate-quote-swap' : ''}`}>
                                            {dailyQuote && (
                                                <>
                                                    <p className={`text-base italic mb-3 leading-relaxed ${t.textPrimary}`}>"{dailyQuote.text}"</p>
                                                    <p className={`text-sm font-bold text-right ${t.textMuted}`}>— {dailyQuote.author}</p>
                                                </>
                                            )}
                                        </div>
                                        <div className="flex justify-end gap-2 mt-4 pt-3 border-t border-stone-200">
                                            <button onClick={() => setShowQuotesListModal(true)} className={`p-2 rounded-full hover:bg-stone-200 ${t.textMuted}`}><IconList size={18} /></button>
                                            <button onClick={pickRandomQuote} className={`p-2 rounded-full hover:bg-stone-200 ${t.textMuted}`}><IconRefresh size={18} /></button>
                                            <button onClick={() => { setShowQuoteForm(!showQuoteForm); setEditingQuoteIndex(null); setNewQuoteText(''); setNewQuoteAuthor(''); }} className={`p-2 rounded-full hover:bg-stone-200 ${t.textMuted}`}><IconPlus size={18} /></button>
                                        </div>
                                        {showQuoteForm && (
                                            <div className="mt-4 animate-fade-in-down space-y-3">
                                                <TextArea t={t} value={newQuoteText} onChange={setNewQuoteText} placeholder="Dein stoisches Zitat..." rows="h-20" />
                                                <input type="text" className={`w-full p-2 rounded-lg border outline-none text-sm ${t.inputBg} ${t.inputBorder} ${t.inputText}`} placeholder="Autor" value={newQuoteAuthor} onChange={(e) => setNewQuoteAuthor(e.target.value)} />
                                                <div className="flex gap-2">
                                                    <button onClick={handleAddQuote} className={`flex-1 py-2 rounded-lg text-sm font-bold ${t.buttonPrimary}`}>{editingQuoteIndex !== null ? 'Speichern' : 'Hinzufügen'}</button>
                                                    <button onClick={() => {setShowQuoteForm(false); setEditingQuoteIndex(null);}} className="px-4 py-2 rounded-lg text-sm font-bold border border-stone-300">Abbrechen</button>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <div className={`p-5 rounded-xl border transition-colors duration-500 ${t.card}`}>
                                        <label className={`block text-sm font-bold mb-2 ${t.textPrimary}`}>Stimmung</label>
                                        <input type="text" className={`w-full p-3 rounded-lg border outline-none text-sm ${t.inputBg} ${t.inputBorder} ${t.inputText}`} value={entry.mood} onChange={(e) => handleInputChange('mood', e.target.value)} />
                                    </div>

                                    <div className={`p-5 rounded-xl border transition-colors duration-500 ${t.card}`}>
                                        <SectionHeader t={t} title="Dichotomie der Kontrolle" />
                                        <TextArea t={t} label="In meiner Macht:" value={entry.controlIn} onChange={(v) => handleInputChange('controlIn', v)} />
                                        <TextArea t={t} label="Nicht in meiner Macht:" value={entry.controlOut} onChange={(v) => handleInputChange('controlOut', v)} />
                                    </div>

                                    <div className={`p-5 rounded-xl border transition-colors duration-500 ${t.card}`}>
                                        <SectionHeader t={t} title="Vorausschau" />
                                        <TextArea t={t} label="Hindernis:" value={entry.obstacle} onChange={(v) => handleInputChange('obstacle', v)} />
                                        <TextArea t={t} label="Reaktion:" value={entry.reaction} onChange={(v) => handleInputChange('reaction', v)} />
                                    </div>

                                    <div className={`p-5 rounded-xl border transition-colors duration-500 ${t.card}`}>
                                        <SectionHeader t={t} title="Tagesintention" />
                                        <div className="grid grid-cols-2 gap-3 mb-4">
                                            {virtues.map((v) => (
                                                <button key={v.id} onClick={() => handleInputChange('virtue', v.id)} className={`p-3 rounded-lg border flex flex-col items-center gap-2 transition-all duration-300 ${entry.virtue === v.id ? t.virtueBtnActive : t.virtueBtnInactive}`}>
                                                    {v.icon}<span className="font-bold text-sm">{v.id}</span>
                                                </button>
                                            ))}
                                        </div>
                                        {entry.virtue && <TextArea t={t} label={`Warum ${entry.virtue}?`} value={entry.virtueReason} onChange={(v) => handleInputChange('virtueReason', v)} rows="h-20" placeholder="Begründe deine Wahl..." />}
                                        
                                        <div className="mb-4 pt-4 border-t border-stone-200">
                                            <p className={`text-sm italic mb-3 ${t.textMuted}`}>Laster-Bearbeitung:</p>
                                            <div className="grid grid-cols-2 gap-3 mb-4">
                                                {vicesList.map((v) => (
                                                    <button key={v.id} onClick={() => handleViceToggle(v.id)} className={`p-3 rounded-lg border flex flex-col items-center gap-2 transition-all duration-300 ${(entry.vices || []).includes(v.id) ? t.viceBtnActive : t.virtueBtnInactive}`}>
                                                        {v.icon}<span className="font-bold text-sm">{v.id}</span>
                                                    </button>
                                                ))}
                                            </div>
                                            {(entry.vices || []).length > 0 && <TextArea t={t} label="Warum diese Laster vermeiden?" value={entry.vicesReason} onChange={(v) => handleInputChange('vicesReason', v)} rows="h-20" placeholder="Begründe die Wahl der Laster..." />}
                                        </div>
                                        <TextArea t={t} label="Konkrete Intention:" value={entry.intention} onChange={(v) => handleInputChange('intention', v)} />
                                    </div>

                                    {!entry.id && <button onClick={() => initiateSave('morning_draft')} className={`w-full py-4 rounded-xl font-bold flex justify-center items-center gap-2 shadow-lg ${t.buttonPrimary}`}><IconSave size={20} /> Morgen speichern</button>}
                                </div>
                            )}

                            {activeTab === 'evening' && (
                                <div className="space-y-6 animate-fade-in">
                                    <div className={`p-5 rounded-xl border transition-colors duration-500 ${t.card}`}>
                                        <SectionHeader t={t} title="Abend-Reflexion" />
                                        <TextArea t={t} label="Was war falsch?" value={entry.wrong} onChange={(v) => handleInputChange('wrong', v)} />
                                        <TextArea t={t} label="Was war richtig?" value={entry.right} onChange={(v) => handleInputChange('right', v)} />
                                        <TextArea t={t} label="Besser machen?" value={entry.better} onChange={(v) => handleInputChange('better', v)} />
                                    </div>
                                    <div className={`p-5 rounded-xl border transition-colors duration-500 ${t.card}`}>
                                        <TextArea t={t} label="Amor Fati" value={entry.gratitude} onChange={(v) => handleInputChange('gratitude', v)} />
                                    </div>
                                    <div className={`p-5 rounded-xl border transition-colors duration-500 ${t.card}`}>
                                        <TextArea t={t} label="Memento Mori" value={entry.mementoMori} onChange={(v) => handleInputChange('mementoMori', v)} />
                                    </div>
                                    <button onClick={() => initiateSave('final')} className={`w-full py-4 rounded-xl font-bold flex justify-center items-center gap-2 shadow-lg ${t.buttonPrimary}`}><IconSave size={20} /> Tag abschließen</button>
                                </div>
                            )}

                            {activeTab === 'history' && (
                                <div className="space-y-4 animate-fade-in">
                                    <h2 className={`text-xl font-bold mb-4 px-2 ${t.textPrimary}`}>Verlauf</h2>
                                    {history.map((h) => (
                                        <div key={h.id} className={`p-5 rounded-xl border ${t.card}`}>
                                            <div className="flex justify-between items-start mb-3 border-b pb-3 border-stone-100">
                                                <div>
                                                    <h4 className={`font-bold ${t.textPrimary}`}>{formatDate(h.date)}</h4>
                                                    <div className="flex flex-wrap gap-2 mt-2">
                                                        <span className="text-[10px] px-2 py-1 rounded bg-stone-100 text-stone-600 font-bold">{h.virtue}</span>
                                                        {(h.vices || []).map(v => <span key={v} className="text-[10px] px-2 py-1 rounded bg-red-100 text-red-700 font-bold">{v}</span>)}
                                                    </div>
                                                </div>
                                                <div className="flex gap-1">
                                                    <button onClick={() => handleEdit(h)} className="p-2 text-stone-400"><IconEdit size={16} /></button>
                                                    <button onClick={() => handleDelete(h.id)} className="p-2 text-rose-400"><IconTrash size={16} /></button>
                                                </div>
                                            </div>
                                            <div className="space-y-2 text-sm">
                                                {h.virtueReason && <p className={t.textSecondary}><strong>Tugend-Grund:</strong> {h.virtueReason}</p>}
                                                {h.vicesReason && <p className={t.textSecondary}><strong>Laster-Grund:</strong> {h.vicesReason}</p>}
                                                <p className={t.textSecondary}><strong>Intention:</strong> {h.intention}</p>
                                                <p className={t.textSecondary}><strong>Dankbar:</strong> {h.gratitude}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </main>

                        <nav className={`border-t absolute bottom-0 w-full rounded-t-2xl shadow-lg pb-safe transition-colors z-20 ${t.navBg}`}>
                            <div className="flex justify-around p-3">
                                <button onClick={() => setActiveTab('morning')} className={`flex flex-col items-center p-2 ${activeTab === 'morning' ? t.navActive : t.navInactive}`}><IconSun size={24} /><span className="text-xs font-bold mt-1">Morgen</span></button>
                                <button onClick={() => setActiveTab('evening')} className={`flex flex-col items-center p-2 ${activeTab === 'evening' ? t.navActive : t.navInactive}`}><IconMoon size={24} /><span className="text-xs font-bold mt-1">Abend</span></button>
                                <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center p-2 ${activeTab === 'history' ? t.navActive : t.navInactive}`}><IconBook size={24} /><span className="text-xs font-bold mt-1">Verlauf</span></button>
                            </div>
                        </nav>

                        {/* --- MODALS --- */}
                        {showQuotesListModal && (
                            <div className="absolute inset-0 z-50 flex flex-col bg-stone-900/60 backdrop-blur-sm animate-fade-in">
                                <div className="flex-1" onClick={() => setShowQuotesListModal(false)}></div>
                                <div className={`h-[85%] rounded-t-3xl shadow-2xl flex flex-col animate-slide-up ${t.container}`}>
                                    <div className="p-5 border-b flex justify-between items-center shrink-0 border-stone-200">
                                        <h2 className={`text-xl font-bold flex items-center gap-2 ${t.textPrimary}`}><IconQuote size={20} className="opacity-70" /> Zitate</h2>
                                        <button onClick={() => setShowQuotesListModal(false)} className="p-2 text-stone-400"><IconClose size={20} /></button>
                                    </div>
                                    <div className="flex-1 overflow-y-auto p-5 pb-safe space-y-3">
                                        {quotes.map((q, i) => (
                                            <div key={i} className={`p-4 rounded-xl border flex justify-between items-start ${t.card}`}>
                                                <div className="flex-1">
                                                    <p className={`text-sm italic mb-2 ${t.textPrimary}`}>"{q.text}"</p>
                                                    <p className={`text-xs text-right font-bold ${t.textMuted}`}>— {q.author}</p>
                                                </div>
                                                <div className="flex flex-col ml-3 gap-2">
                                                    <button onClick={() => handleEditQuoteRequest(i)} className="p-1 text-stone-400"><IconEdit size={14} /></button>
                                                    <button onClick={() => handleDeleteQuote(i)} className="p-1 text-rose-400"><IconTrash size={14} /></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {showSettingsModal && (
                            <div className="absolute inset-0 z-50 flex flex-col bg-stone-900/60 backdrop-blur-sm animate-fade-in">
                                <div className="flex-1" onClick={() => setShowSettingsModal(false)}></div>
                                <div className={`rounded-t-3xl shadow-2xl flex flex-col animate-slide-up ${t.container}`}>
                                    <div className="p-5 border-b flex justify-between items-center shrink-0 border-stone-200">
                                        <h2 className={`text-xl font-bold flex items-center gap-2 ${t.textPrimary}`}><IconSettings size={20} className="opacity-70" /> Einstellungen</h2>
                                        <button onClick={() => setShowSettingsModal(false)} className="p-2 text-stone-400"><IconClose size={20} /></button>
                                    </div>
                                    <div className="p-6 pb-safe space-y-4 text-center">
                                        <button onClick={handleExportData} className={`w-full py-3 rounded-xl font-bold flex justify-center items-center gap-2 ${t.buttonPrimary}`}><IconDownload size={18} /> Backup exportieren</button>
                                        <label className={`w-full py-3 rounded-xl font-bold border border-stone-400 flex justify-center items-center gap-2 cursor-pointer ${t.textPrimary}`}>
                                            <IconUpload size={18} /> Backup importieren
                                            <input type="file" accept=".json" onChange={handleImportData} className="hidden" />
                                        </label>
                                    </div>
                                </div>
                            </div>
                        )}

                        {confirmModal.isOpen && (
                            <div className="absolute inset-0 z-[100] flex items-center justify-center bg-stone-900/60 backdrop-blur-sm animate-fade-in px-4">
                                <div className={`w-full max-w-sm rounded-2xl shadow-2xl p-6 ${t.card}`}>
                                    <h3 className={`text-xl font-bold mb-3 ${t.textPrimary}`}>{confirmModal.title}</h3>
                                    <p className={`text-sm mb-6 whitespace-pre-wrap ${t.textSecondary}`}>{confirmModal.message}</p>
                                    <div className="flex gap-3">
                                        <button onClick={() => setConfirmModal({ isOpen: false })} className="flex-1 py-3 rounded-xl font-bold border border-stone-400">Abbrechen</button>
                                        <button onClick={confirmModal.onConfirm} className={`flex-1 py-3 rounded-xl font-bold text-white shadow-lg ${confirmModal.isDanger ? 'bg-rose-600' : 'bg-stone-800'}`}>{confirmModal.confirmText}</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
